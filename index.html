<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comics - SuperHero Hunter</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,400,700&display=swap">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body onload="character()">

  <!-- Navbar -->
  <nav class="custom-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="./logo.png" alt="Marvel Logo">
      </a>
      <ul class="nav-links">
        <li><a href="#" class="active">Characters</a></li>
        <li><a href="#">Comics</a></li>
        <li><a href="#">Series</a></li>
        <li><a href="Favourites.html">Favourites</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-container">
      <h1 class="header-main-title">SuperHero Hunter</h1>
      <form id="connectionForm" class="search-form" onsubmit="return false;">
        <input type="text" name="name" id="name" class="character-search-box"
          placeholder="(Ex. Hulk, Loki, Thor, Thanos, Odin etc...)" onkeyup="showCorrespondingHeros()">
        <input type="submit" value="Search!" class="search-character-button">
      </form>
      <div id="cards-group" class="cards-group"></div>
    </div>
  </section>

  <!-- Main Content -->
  <div class="content-container" id="contentContainer">
    <div id="characterSpinnerSection"></div>
    <div id="comicsSpinnerSection"></div>
    <section id="characterSection"></section>
    <section id="comicSection"></section>
  </div>

  <!-- Scripts -->
  <script src="script3.js"></script>
</body>

</html>
